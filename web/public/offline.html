<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#242321" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · VinyLink</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f3ebdd;
        color: #242321;
        font-family: system-ui, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
      }
      img {
        width: 96px;
        height: 96px;
      }
      h1 {
        font-family: Georgia, serif;
        font-weight: 400;
        font-size: 1.8rem;
        margin: 16px 0 8px;
      }
      p {
        color: #5a4232;
        line-height: 1.5;
      }
      button {
        margin-top: 12px;
        padding: 12px 22px;
        border: none;
        border-radius: 6px;
        background: #59604a;
        color: #fffdf8;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" width="96" height="96" />
      <h1>Estás sin conexión</h1>
      <p>No pudimos cargar esta página. Revisa tu internet; tu carrito sigue guardado en este dispositivo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
